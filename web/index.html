  <div id="desktop" class="desktop" tabindex="-1">
    <header class="topbar">
      <button class="brand-button" id="brand-button" aria-label="Abrir launcher"><span class="brand-mark">LB</span><span>PIBIC Workspace</span></button>
      <div class="topbar-center"><span id="hostname">VM</span><span class="connection-dot" id="connection-dot"></span><span id="connection-label">Conectando</span></div>
      <button class="status-button" id="status-button" aria-label="Abrir status do sistema"><span id="top-cpu">CPU --</span><span id="top-ram">RAM --</span><span id="clock">--:--</span></button>
    </header>

    <main id="desktop-area" class="desktop-area" aria-label="Área de trabalho"></main>
    <div id="window-layer" class="window-layer"></div>

    <nav id="taskbar" class="taskbar" aria-label="Barra de tarefas">
      <button id="launcher-button" class="taskbar-button launcher-button" aria-label="Aplicativos"><svg><use href="#i-grid"/></svg></button>
      <div id="favorite-apps" class="taskbar-group"></div>
      <div class="taskbar-divider"></div>
      <div id="running-apps" class="taskbar-group running-apps"></div>
      <button id="notification-button" class="taskbar-button taskbar-right" aria-label="Notificações"><svg><use href="#i-info"/></svg><span id="notification-count" class="notification-count hidden">0</span></button>
    </nav>

    <section id="launcher" class="launcher hidden" role="dialog" aria-label="Launcher de aplicativos">
      <div class="launcher-search"><svg><use href="#i-search"/></svg><input id="launcher-search" autocomplete="off" placeholder="Pesquisar aplicativos" aria-label="Pesquisar aplicativos"></div>
      <div id="launcher-results" class="launcher-results"></div>
    </section>

    <section id="quick-status" class="quick-status hidden" role="dialog" aria-label="Status rápido"></section>
    <section id="notification-center" class="notification-center hidden" role="dialog" aria-label="Central de notificações"><div class="panel-title"><strong>Notificações</strong><button data-action="clear-notifications" class="text-button">Limpar</button></div><div id="notification-history"></div></section>
    <div id="context-menu" class="context-menu hidden" role="menu"></div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>
    <div id="dialog-layer" class="dialog-layer"></div>
  </div>

  <script src="/static/vendor/xterm-bundle.js"></script>
  <script src="/static/vendor/codemirror-bundle.js"></script>
  <script type="module" src="/static/js/desktop.js?v=4.2.0"></script>
  <script src="/static/js/alpinews-v3.js?v=4.2.0"></script>
  <script src="/static/js/alpinews-launcher.js?v=4.2.0"></script>
  <script src="/static/js/alpinews-v4-fixes.js?v=4.2.0"></script>
</body>
</html>
