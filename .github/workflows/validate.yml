name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python syntax
        run: python -m compileall -q app
      - name: Validate JavaScript syntax
        run: |
          node --check web/js/alpinews-v3.js
          node --check web/js/alpinews-v4-fixes.js
          node --check web/js/alpinews-launcher.js
          node --check web/js/app-workbench.js
          node --check web/js/mint-workspace.js
          node --check web/js/api.js
          node --check web/js/apps.js
          node --check web/js/desktop.js
          node --check web/js/terminal.js
          node --check web/js/window-manager.js
      - name: Check active UI assets
        run: |
          grep -q 'alpinews-v4.css?v=4.4.0' web/index.html
          grep -q 'alpinews-v4-fixes.js?v=4.4.0' web/index.html
          grep -q 'alpinews-launcher.css?v=4.4.0' web/index.html
          grep -q 'alpinews-launcher.js?v=4.4.0' web/index.html
          grep -q 'app-workbench.css?v=4.4.0' web/index.html
          grep -q 'app-workbench.js?v=4.4.0' web/index.html
          grep -q 'mint-desktop.css?v=4.4.0' web/index.html
          grep -q 'mint-workspace.js?v=4.4.0' web/index.html
          test -s web/css/alpinews-launcher.css
          test -s web/js/alpinews-launcher.js
          test -s web/css/app-workbench.css
          test -s web/js/app-workbench.js
          test -s web/css/mint-desktop.css
          test -s web/js/mint-workspace.js
          ! grep -q 'ui-refresh.js' web/index.html
          ! grep -q 'ui-refresh.css' web/index.html
      - name: Validate deploy scripts
        run: |
          sh -n deploy/apply.sh
          sh -n update.sh
          sh -n update-local.sh
